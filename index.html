<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bingo Virtual</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9f5d8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            padding: clamp(12px, 3vw, 24px);
            max-width: min(900px, 140vh);
            width: 100%;
            box-sizing: border-box;
        }

        .container img {
            display: block;
            width: 100%;
            max-height: calc(100dvh - 140px);
            object-fit: contain;
            height: auto;
            border-radius: 10px;
        }

        h1 {
            color: #0056A6;
            font-size: 3em;
            margin: 20px 0;
        }

        h2 {
            color: #7DBE34;
            font-size: 2.5em;
            margin: 10px 0;
        }

        .start-button {
            background-color: #7DBE34;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: clamp(1.1em, 2.5vw, 1.4em);
            width: min(100%, 340px);
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: clamp(10px, 2vh, 20px);
        }

        .start-button:hover {
            background-color: #66a72d;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="INICIAR.png" alt="Bingo Virtual">
        <button class="start-button" onclick="startBingo()">INICIAR</button>
    </div>

    <script>
        function startBingo() {
            // Redirige a la página local "bolillero.html" en la misma carpeta
            window.location.href = 'bolillero.html';
        }
    </script>

</body>
</html>
