<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bingo Virtual - Bolillero</title>
    <link rel="stylesheet" href="bingo.css">
    <style>
        /* =========================================================
           Base: celular vertical (una columna, todo apilado)
           ========================================================= */
        .juego {
            display: grid; gap: 12px; padding: 10px;
            grid-template-areas: "sorteo" "tablero" "estado";
            max-width: 1800px; margin: 0 auto;
        }
        .juego > * { min-width: 0; }
        .sorteo { grid-area: sorteo; }
        .panel-tablero { grid-area: tablero; display: flex; flex-direction: column; }
        .estado { grid-area: estado; display: grid; gap: 12px; }

        /* ---- Escena: bolillero + bolilla, uno al lado del otro ---- */
        .sorteo { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .escena {
            display: flex; align-items: center; justify-content: center; gap: 4%;
            width: 100%;
            --m: clamp(5px, 1.9vw, 8px);          /* escala del bolillero */
            --b: clamp(100px, 33vw, 170px);       /* tamaño de la bolilla */
        }

        /* Bolillero (dibujado en "em": se escala cambiando --m) */
        .maquina { position: relative; font-size: var(--m); width: 25em; height: 25em; flex: none; }
        .globo {
            position: absolute; inset: 0 2.5em 5em; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(220,235,245,.5) 45%, rgba(26,125,181,.18));
            border: .5em solid #253642; overflow: hidden;
            box-shadow: inset 0 -1.2em 2.5em rgba(0,0,0,.12), 0 .8em 1.8em rgba(0,0,0,.15);
        }
        .alambres { position: absolute; inset: 0 2.5em 5em; border-radius: 50%; pointer-events: none; z-index: 3; }
        .alambres i { position: absolute; inset: 0; border: .3em solid #253642; border-radius: 50%; opacity: .85; }
        .alambres i:nth-child(1) { transform: scaleX(.35); }
        .alambres i:nth-child(2) { transform: scaleX(.7); }
        .alambres i:nth-child(3) { transform: scaleY(.35); }
        .alambres i:nth-child(4) { transform: scaleY(.7); }
        .bolitas { position: absolute; inset: 0; }
        .bolita {
            position: absolute; width: 2.2em; height: 2.2em; border-radius: 50%;
            box-shadow: inset -.3em -.3em .5em rgba(0,0,0,.25), inset .2em .2em .3em rgba(255,255,255,.6);
            transition: top .5s, left .5s;
        }
        .soporte {
            position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
            width: 20em; height: 5.2em; border-radius: 1.4em 1.4em .8em .8em;
            background: linear-gradient(#2189c6, var(--azul-osc));
            box-shadow: 0 .8em 1.6em rgba(0,0,0,.2);
        }
        .soporte::before {
            content: ""; position: absolute; left: 50%; top: -3.4em; transform: translateX(-50%);
            width: 2.6em; height: 4em; background: var(--azul-osc); border-radius: .8em .8em 0 0;
        }
        .boca {
            position: absolute; left: 50%; top: 1em; transform: translateX(-50%);
            width: 5.6em; height: 2.8em; border-radius: 50%; background: #0b3e5c;
            box-shadow: inset 0 .4em .8em rgba(0,0,0,.5);
        }
        .manivela {
            position: absolute; right: .4em; top: 9.2em; width: 3.4em; height: 3.4em; border-radius: 50%;
            background: var(--azul); border: .4em solid #253642; z-index: 4;
        }
        .manivela::after { content: ""; position: absolute; left: 50%; top: 50%; width: .6em; height: 3em; background: #253642; transform-origin: 50% 0; transform: translate(-50%, 0); border-radius: .3em; }
        .girando .alambres, .girando .manivela { animation: girar .35s linear infinite; }
        .girando .globo { animation: temblor .12s linear infinite; }
        .girando .bolita { animation: rebote .25s ease-in-out infinite alternate; }

        /* Bolilla grande */
        .bola-grande {
            --c: #9aa5ae; flex: none;
            width: var(--b); height: var(--b); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 32% 28%, #fff 0 6%, var(--c) 34%, color-mix(in srgb, var(--c) 70%, #000) 100%);
            box-shadow: 0 .9em 2em rgba(0,0,0,.25), inset -10px -14px 22px rgba(0,0,0,.25);
        }
        .bola-grande .cara {
            width: 58%; height: 58%; border-radius: 50%; background: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: calc(var(--b) * .33); font-weight: 900; color: #1d2b36; line-height: 1;
            box-shadow: inset 0 -4px 8px rgba(0,0,0,.12);
        }
        .bola-grande.vacia .cara { font-size: calc(var(--b) * .2); color: #9aa5ae; }
        .bola-grande.sale { animation: salir .7s cubic-bezier(.2, 1.4, .4, 1); }

        .contador { font-size: clamp(15px, 2.2vh, 20px); font-weight: 700; color: var(--gris); text-align: center; }
        .contador b { color: var(--azul); font-size: 1.3em; }

        .btn-girar {
            width: 100%; font-size: clamp(18px, 2.6vh, 24px); padding: clamp(10px, 1.6vh, 16px); border-radius: 14px;
            background: linear-gradient(var(--verde), var(--verde-osc)); color: #fff;
            box-shadow: 0 5px 0 #557510, 0 10px 20px rgba(0,0,0,.15); letter-spacing: 1px;
        }
        .btn-girar:hover { background: linear-gradient(#9acb22, var(--verde-osc)); }
        .btn-girar:active { transform: translateY(4px); box-shadow: 0 1px 0 #557510; }
        .controles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        .controles .btn, .controles select { width: 100%; padding: 9px 8px; }
        .atajos { font-size: 12px; color: var(--gris); text-align: center; }
        kbd { background: #eef3e2; border-radius: 4px; padding: 1px 5px; font-family: inherit; font-weight: 700; }

        .ultimas-box { width: 100%; }
        .ultimas-box h3 { margin: 4px 0 8px; font-size: 14px; color: var(--gris); text-align: center; font-weight: 700; }
        .ultimas { display: flex; gap: 6px; justify-content: center; flex-wrap: nowrap; overflow: hidden; min-height: 40px; }
        .mini {
            --t: clamp(30px, 9vw, 44px);
            width: var(--t); height: var(--t); flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 32% 28%, #fff 0 5%, var(--c) 40%, color-mix(in srgb, var(--c) 70%, #000));
            box-shadow: 0 3px 8px rgba(0,0,0,.2);
        }
        .mini span { background: #fff; border-radius: 50%; width: 62%; height: 62%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: calc(var(--t) * .34); }

        /* ---- Tablero 1-90 ---- */
        .tablero-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .tablero-cab h2 { margin: 0; }
        .tablero { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: clamp(3px, .6vw, 7px); flex: 1; min-height: 0; }
        .casilla {
            aspect-ratio: 1.25 / 1; display: flex; align-items: center; justify-content: center;
            border-radius: clamp(4px, .6vw, 9px); background: #f1f5e8; color: #9aa79a;
            font-weight: 800; font-size: clamp(13px, 3.6vw, 30px); min-width: 0;
            transition: background .3s, color .3s, transform .3s;
        }
        .casilla.salio { background: var(--c); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
        .casilla.ultima { transform: scale(1.12); box-shadow: 0 0 0 3px var(--tinta); position: relative; z-index: 1; animation: latido 1s ease-in-out 3; }
        .fase {
            display: inline-flex; align-items: center; gap: 8px; font-weight: 800; padding: 5px 12px; font-size: 14px;
            border-radius: 99px; background: var(--verde-claro); color: var(--verde-osc);
        }
        .fase.linea { background: #fff3cd; color: #8a6100; }
        .fase.bingo { background: #fde8e7; color: #b42318; }
        .fase.fin { background: var(--tinta); color: #fff; }

        .lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow: auto; }
        .lista li { display: flex; gap: 6px 8px; align-items: center; flex-wrap: wrap; padding: 7px 10px; border-radius: 10px; background: #f6f9ef; font-size: 14px; }
        .lista li b { color: var(--azul); }
        .lista .vacio { background: none; color: var(--gris); font-style: italic; }
        .lista .falta { margin-left: auto; font-weight: 800; color: var(--rojo); white-space: nowrap; }

        @media (hover: none) { .atajos { display: none; } }

        /* ---- Celebración ---- */
        .celebra .modal-caja { width: min(760px, 100%); text-align: center; }
        .celebra h3 { font-size: clamp(34px, 7vw, 56px); margin: 0; letter-spacing: 2px; color: var(--rojo); }
        .celebra .sub { color: var(--gris); margin-bottom: 12px; }
        .ganadores-cartones { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px; margin: 12px 0 16px; text-align: left; }
        .confeti { position: fixed; top: -20px; width: 10px; height: 16px; z-index: 250; pointer-events: none; animation: caer linear forwards; }
        .verif-res { display: grid; gap: 12px; margin-top: 14px; }

        /* =========================================================
           Tablet vertical / pantallas medianas
           ========================================================= */
        @media (min-width: 600px) {
            .juego { padding: 16px; gap: 16px; }
            .escena { --m: clamp(6px, 1.3vw, 9px); --b: clamp(130px, 24vw, 200px); }
            .controles { grid-template-columns: 1.1fr .9fr 1fr 1fr; }
            .estado { grid-template-columns: 1fr 1fr; }
            .casilla { font-size: clamp(16px, 2.6vw, 30px); }
        }

        /* =========================================================
           Horizontal: zona de juego a pantalla completa, sin scroll
           (notebook, proyector, TV, tablet acostada)
           ========================================================= */
        @media (orientation: landscape) and (min-width: 900px) {
            body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
            .topbar { position: static; flex: none; }
            .juego {
                flex: 1; min-height: 0; width: 100%;
                grid-template-columns: minmax(300px, 30vw) minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) auto;
                grid-template-areas: "sorteo tablero" "sorteo estado";
                padding: clamp(10px, 1.6vh, 18px); gap: clamp(10px, 1.6vh, 18px);
            }
            .sorteo { justify-content: space-evenly; padding: clamp(10px, 1.8vh, 20px); min-height: 0; gap: clamp(6px, 1.2vh, 14px); }
            .escena { --m: clamp(5px, min(.6vw, .95vh), 11px); --b: clamp(90px, min(11vw, 19vh), 240px); }
            .controles { grid-template-columns: 1fr 1fr; }
            .panel-tablero { min-height: 0; padding: clamp(10px, 1.8vh, 18px); }
            .tablero { grid-template-rows: repeat(9, minmax(0, 1fr)); }
            .casilla { aspect-ratio: auto; font-size: clamp(13px, min(2.2vw, 4.2vh), 40px); }
            .estado { grid-template-columns: 1fr 1fr; }
            .estado .panel { padding: 12px 16px; }
            .estado .lista { max-height: clamp(60px, 14vh, 200px); }
            .estado h2 { font-size: 16px; margin-bottom: 8px; }
            .mini { --t: clamp(30px, min(2.6vw, 5vh), 52px); }
        }
        /* Pantallas anchas: tercera columna con "cerca de ganar" y ganadores */
        @media (orientation: landscape) and (min-width: 1280px) {
            .juego {
                grid-template-columns: minmax(320px, 26vw) minmax(0, 1fr) minmax(250px, 19vw);
                grid-template-rows: minmax(0, 1fr);
                grid-template-areas: "sorteo tablero estado";
            }
            .estado { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; min-height: 0; }
            .estado .panel { display: flex; flex-direction: column; min-height: 0; }
            .estado .lista { max-height: none; flex: 1; min-height: 0; }
            .escena { --m: clamp(5px, min(.5vw, .95vh), 12px); --b: clamp(90px, min(10vw, 22vh), 260px); }
        }
        /* Poca altura: se esconden detalles secundarios */
        @media (orientation: landscape) and (min-width: 900px) and (max-height: 820px) { .atajos { display: none; } }
        @media (orientation: landscape) and (min-width: 900px) and (max-height: 680px) { .ultimas-box h3 { display: none; } .tablero-cab { margin-bottom: 6px; } }

        /* =========================================================
           Celular acostado (poca altura)
           ========================================================= */
        @media (orientation: landscape) and (max-width: 899px) {
            .topbar { padding: 5px 10px; }
            .topbar .btn { padding: 5px 8px; }
            .juego {
                grid-template-columns: minmax(230px, 40%) minmax(0, 1fr);
                grid-template-areas: "sorteo tablero" "estado estado";
                padding: 8px; gap: 8px;
            }
            .sorteo, .panel-tablero { padding: 10px; height: calc(100dvh - 58px); min-height: 250px; }
            .sorteo { justify-content: space-evenly; gap: 6px; }
            .escena { --m: clamp(4px, 1.4vh, 7px); --b: clamp(70px, 24vh, 130px); }
            .contador { font-size: 14px; }
            .btn-girar { font-size: 16px; padding: 8px; }
            .controles { grid-template-columns: 1fr 1fr; gap: 5px; }
            .controles .btn, .controles select { padding: 5px; font-size: 13px; }
            .atajos, .ultimas-box h3 { display: none; }
            .mini { --t: clamp(22px, 8vh, 34px); }
            .tablero { grid-template-rows: repeat(9, minmax(0, 1fr)); gap: 3px; }
            .tablero-cab { margin-bottom: 6px; }
            .tablero-cab h2 { font-size: 15px; }
            .fase { font-size: 12px; padding: 3px 9px; }
            .casilla { aspect-ratio: auto; font-size: clamp(11px, 4.2vh, 20px); border-radius: 5px; }
            .estado { grid-template-columns: 1fr 1fr; }
        }

        @keyframes girar { to { transform: rotate(360deg); } }
        @keyframes temblor { 0%,100% { transform: translate(0,0) } 25% { transform: translate(-2px,1px) } 75% { transform: translate(2px,-1px) } }
        @keyframes rebote { to { transform: translate(var(--dx), var(--dy)); } }
        @keyframes salir { 0% { transform: translateY(-40%) scale(.2); opacity: 0; } 100% { transform: none; opacity: 1; } }
        @keyframes caer { to { transform: translateY(110vh) rotate(720deg); } }
        @media (prefers-reduced-motion: reduce) { .girando * , .bola-grande.sale, .confeti { animation: none !important; } }
    </style>
</head>
<body>

<header class="topbar">
    <div class="marca">BINGO <span>VIRTUAL</span></div>
    <button class="btn btn-chico" id="btnVoz" title="Cantar los números en voz alta"><span class="ico">🔊</span><span class="txt">Voz</span></button>
    <button class="btn btn-chico" id="btnSonido" title="Efectos de sonido"><span class="ico">🎵</span><span class="txt">Sonido</span></button>
    <button class="btn btn-chico" id="btnVerificar" title="Verificar cartón"><span class="ico">🔎</span><span class="txt">Verificar cartón</span></button>
    <a class="btn btn-chico" href="registrar_cartones.html" title="Cartones"><span class="ico">🎟️</span><span class="txt">Cartones</span></a>
    <button class="btn btn-chico" id="btnPantalla" title="Pantalla completa (F)"><span class="ico">⛶</span><span class="txt">Pantalla completa</span></button>
    <a class="btn btn-chico" href="index.html" title="Inicio"><span class="ico">🏠</span><span class="txt">Inicio</span></a>
</header>

<main class="juego">
    <section class="panel sorteo">
        <div class="escena">
            <div class="maquina" id="maquina" aria-hidden="true">
                <div class="globo"><div class="bolitas" id="bolitas"></div></div>
                <div class="alambres"><i></i><i></i><i></i><i></i></div>
                <div class="manivela"></div>
                <div class="soporte"><div class="boca"></div></div>
            </div>
            <div class="bola-grande vacia" id="bolaGrande" aria-live="polite"><div class="cara" id="bolaNumero">--</div></div>
        </div>
        <div class="contador">Bolilla <b id="nroBolilla">0</b> de 90 · quedan <b id="quedan">90</b></div>

        <button class="btn btn-girar" id="btnGirar">🎰 GIRAR BOLILLERO</button>
        <div class="controles">
            <button class="btn" id="btnAuto">▶ Automático</button>
            <select id="selVelocidad" title="Segundos entre bolillas">
                <option value="4">cada 4 s</option>
                <option value="6" selected>cada 6 s</option>
                <option value="8">cada 8 s</option>
                <option value="12">cada 12 s</option>
            </select>
            <button class="btn" id="btnDeshacer" title="Devolver la última bolilla">↩ Deshacer</button>
            <button class="btn btn-rojo" id="btnReiniciar">⟲ Reiniciar</button>
        </div>
        <div class="atajos"><kbd>Espacio</kbd> girar · <kbd>A</kbd> automático · <kbd>F</kbd> pantalla completa</div>

        <div class="ultimas-box">
            <h3>Últimas bolillas</h3>
            <div class="ultimas" id="ultimas"></div>
        </div>
    </section>

    <section class="panel panel-tablero">
        <div class="tablero-cab">
            <h2>Tablero</h2>
            <span class="fase" id="fase">Jugando por CUATERNO</span>
        </div>
        <div class="tablero" id="tablero"></div>
    </section>

    <section class="estado">
        <div class="panel">
            <h2>⏳ Cerca de ganar</h2>
            <ul class="lista" id="listaCerca"></ul>
        </div>
        <div class="panel">
            <h2>🏆 Ganadores</h2>
            <ul class="lista" id="listaGanadores"></ul>
        </div>
    </section>
</main>

<!-- Celebración -->
<div class="modal celebra" id="modalGanador">
    <div class="modal-caja">
        <h3 id="ganTitulo">¡CUATERNO!</h3>
        <div class="sub" id="ganSub"></div>
        <div class="ganadores-cartones" id="ganCartones"></div>
        <button class="btn btn-verde" id="btnCerrarGanador" style="font-size:18px;padding:12px 26px">Continuar</button>
    </div>
</div>

<!-- Verificar cartón -->
<div class="modal" id="modalVerificar">
    <div class="modal-caja" style="width:min(640px,100%)">
        <h3>🔎 Verificar cartón</h3>
        <div style="display:flex;gap:8px">
            <input type="search" id="verifInput" placeholder="N° de cartón o nombre del comprador" style="flex:1">
            <button class="btn" id="btnCerrarVerif">Cerrar</button>
        </div>
        <div class="verif-res" id="verifRes"></div>
    </div>
</div>

<!-- Confirmar -->
<div class="modal" id="modalConfirmar">
    <div class="modal-caja" style="width:min(420px,100%)">
        <h3 id="confTitulo">¿Seguro?</h3>
        <p id="confTexto" style="margin:0 0 16px"></p>
        <div style="display:flex;gap:8px;justify-content:flex-end">
            <button class="btn" id="confNo">Cancelar</button>
            <button class="btn btn-rojo" id="confSi">Sí, continuar</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="bingo-core.js"></script>
<script>
    const $ = id => document.getElementById(id);
    let estado = Bingo.cargarEstado();
    let girando = false;
    let autoTimer = null;
    const prefs = Object.assign({ voz: true, sonido: true, velocidad: 6 }, JSON.parse(localStorage.getItem('bingoPrefs') || '{}'));

    function guardarPrefs() { localStorage.setItem('bingoPrefs', JSON.stringify(prefs)); }

    /* ---------- Sonido y voz ---------- */
    let audioCtx = null;
    function ctx() {
        if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
        return audioCtx;
    }
    function tono(freq, ini, dur, tipo = 'sine', vol = .2) {
        const a = ctx(); if (!a) return;
        const o = a.createOscillator(), g = a.createGain();
        o.type = tipo; o.frequency.value = freq;
        g.gain.setValueAtTime(vol, a.currentTime + ini);
        g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + ini + dur);
        o.connect(g).connect(a.destination);
        o.start(a.currentTime + ini); o.stop(a.currentTime + ini + dur + .05);
    }
    function sonidoGiro(seg) {
        if (!prefs.sonido) return;
        for (let t = 0; t < seg; t += .06 + Math.random() * .05) tono(900 + Math.random() * 900, t, .04, 'triangle', .05);
    }
    function sonidoBola() { if (prefs.sonido) { tono(1046, 0, .5); tono(1568, .08, .6, 'sine', .12); } }
    function sonidoPremio() { if (prefs.sonido) [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tono(f, i * .13, .3, 'square', .07)); }

    const DIGITOS = ['cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve'];
    function decir(texto) {
        if (!prefs.voz || !('speechSynthesis' in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(texto);
        u.lang = 'es-AR'; u.rate = .9;
        const voces = speechSynthesis.getVoices();
        const v = voces.find(v => v.lang === 'es-AR') || voces.find(v => v.lang && v.lang.startsWith('es'));
        if (v) u.voice = v;
        speechSynthesis.speak(u);
    }
    function cantar(n) {
        const s = String(n);
        decir(n > 9 ? `${n}. ${DIGITOS[+s[0]]}, ${DIGITOS[+s[1]]}` : `${n}. ${DIGITOS[n]} solito`);
    }

    function toast(msg) {
        const t = $('toast'); t.textContent = msg; t.classList.add('ver');
        clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('ver'), 2200);
    }

    /* ---------- Dibujo ---------- */
    function dibujarBolitas() {
        const cont = $('bolitas');
        const quedan = estado.numbers.length;
        const cuantas = Math.min(26, Math.ceil(quedan / 3.5));
        const muestra = estado.numbers.slice().sort(() => Math.random() - .5).slice(0, cuantas);
        cont.innerHTML = muestra.map((n, i) => {
            const fila = Math.floor(i / 7);
            const top = 72 - fila * 15 + (Math.random() * 6 - 3);
            const left = 8 + (i % 7) * 12 + (fila % 2) * 5 + (Math.random() * 4 - 2);
            return `<span class="bolita" style="background:${Bingo.colorBola(n)};top:${top}%;left:${left}%;--dx:${(Math.random() * 30 - 15).toFixed(0)}px;--dy:${(-10 - Math.random() * 40).toFixed(0)}px"></span>`;
        }).join('');
    }

    function dibujarTablero() {
        const sacadas = new Set(estado.drawnNumbers);
        const ultima = estado.drawnNumbers[estado.drawnNumbers.length - 1];
        $('tablero').innerHTML = Array.from({ length: 90 }, (_, i) => i + 1).map(n =>
            `<div class="casilla ${sacadas.has(n) ? 'salio' : ''} ${n === ultima ? 'ultima' : ''}" style="--c:${Bingo.colorBola(n)}">${n}</div>`
        ).join('');
    }

    function dibujarBolaGrande(animar) {
        const ultima = estado.drawnNumbers[estado.drawnNumbers.length - 1];
        const b = $('bolaGrande');
        if (ultima == null) {
            b.classList.add('vacia'); b.style.setProperty('--c', '#9aa5ae'); $('bolaNumero').textContent = '--';
        } else {
            b.classList.remove('vacia'); b.style.setProperty('--c', Bingo.colorBola(ultima)); $('bolaNumero').textContent = ultima;
            if (animar) { b.classList.remove('sale'); void b.offsetWidth; b.classList.add('sale'); }
        }
    }

    function dibujarUltimas() {
        $('ultimas').innerHTML = estado.drawnNumbers.slice(-7).reverse().map(n =>
            `<div class="mini" style="--c:${Bingo.colorBola(n)}"><span>${n}</span></div>`
        ).join('') || '<span style="color:var(--gris)">Todavía no salió ninguna</span>';
    }

    function dibujarEstado() {
        const total = estado.drawnNumbers.length;
        $('nroBolilla').textContent = total;
        $('quedan').textContent = 90 - total;
        $('btnGirar').disabled = girando || estado.numbers.length === 0;
        $('btnDeshacer').disabled = girando || total === 0;

        const fase = $('fase');
        fase.className = 'fase';
        if (estado.numbers.length === 0) { fase.textContent = 'Bolillero vacío'; fase.classList.add('fin'); }
        else if (estado.bingoGanado) { fase.textContent = '🏆 BINGO cantado'; fase.classList.add('fin'); }
        else if (estado.lineaGanada) { fase.textContent = 'Jugando por BINGO'; fase.classList.add('bingo'); }
        else if (estado.cuaternoGanado) { fase.textContent = 'Jugando por LÍNEA'; fase.classList.add('linea'); }
        else fase.textContent = 'Jugando por CUATERNO';

        // Cerca de ganar
        const cartones = Bingo.cargarCartones();
        const sacadas = new Set(estado.drawnNumbers);
        const cerca = [];
        const premio = premioEnJuego();
        if (premio && total) {
            cartones.forEach(c => {
                const p = Bingo.progreso(c, sacadas);
                // Sólo se indica CUÁNTOS números faltan, nunca cuáles
                if (premio === 'cuaterno' && p.maxFila === 3) cerca.push({ c, falta: 1 });
                else if (premio === 'linea' && p.maxFila === 4) cerca.push({ c, falta: 1 });
                else if (premio === 'bingo' && p.faltan.length <= 2) cerca.push({ c, falta: p.faltan.length });
            });
        }
        cerca.sort((a, b) => a.falta - b.falta || (+a.c.numero) - (+b.c.numero));
        $('listaCerca').innerHTML = cartones.length === 0
            ? '<li class="vacio">No hay cartones cargados. <a href="registrar_cartones.html">Cargar cartones</a></li>'
            : cerca.length
                ? cerca.map(x => `<li><b>N° ${Bingo.escapar(x.c.numero)}</b> ${Bingo.escapar(x.c.comprador)}<span class="falta">${x.falta === 1 ? 'le falta 1' : 'le faltan ' + x.falta}</span></li>`).join('')
                : (premio ? `<li class="vacio">Nadie está cerca del ${NOMBRE[premio]} todavía.</li>` : '<li class="vacio">Juego terminado.</li>');

        $('listaGanadores').innerHTML = estado.ganadores.length
            ? estado.ganadores.map(g => `<li><span class="badge badge-${g.tipo}">${NOMBRE[g.tipo]}</span>
                <b>N° ${Bingo.escapar(g.numero)}</b> ${Bingo.escapar(g.comprador)}
                <span class="falta" style="color:var(--gris)">bolilla ${g.bola} (${g.numeroBola})</span></li>`).join('')
            : '<li class="vacio">Sin ganadores aún.</li>';
    }

    function dibujarTodo(animar) {
        dibujarBolitas(); dibujarTablero(); dibujarBolaGrande(animar); dibujarUltimas(); dibujarEstado();
        $('btnVoz').classList.toggle('activo', prefs.voz);
        $('btnSonido').classList.toggle('activo', prefs.sonido);
    }

    /* ---------- Juego ---------- */
    const NOMBRE = { cuaterno: 'CUATERNO', linea: 'LÍNEA', bingo: 'BINGO' };
    const FLAG = { cuaterno: 'cuaternoGanado', linea: 'lineaGanada', bingo: 'bingoGanado' };

    // Premios en orden: CUATERNO (4 de una fila) → LÍNEA (fila completa) → BINGO (cartón lleno)
    function premioEnJuego() {
        if (!estado.cuaternoGanado) return 'cuaterno';
        if (!estado.lineaGanada) return 'linea';
        if (!estado.bingoGanado) return 'bingo';
        return null;
    }

    function evaluarGanadores(n) {
        const premio = premioEnJuego();
        if (!premio) return [];
        const sacadas = new Set(estado.drawnNumbers);
        const nuevos = [];
        Bingo.cargarCartones().forEach(c => {
            const p = Bingo.progreso(c, sacadas);
            const base = { tipo: premio, cartonId: c.id, numero: c.numero, comprador: c.comprador, bola: estado.drawnNumbers.length, numeroBola: n };
            if (premio === 'cuaterno' && p.cuaterno) nuevos.push(Object.assign(base, { fila: p.filas.findIndex(f => f.marcados >= 4) + 1 }));
            else if (premio === 'linea' && p.linea) nuevos.push(Object.assign(base, { fila: p.filas.findIndex(f => f.completa) + 1 }));
            else if (premio === 'bingo' && p.bingo) nuevos.push(base);
        });
        if (nuevos.length) estado[FLAG[premio]] = true;
        estado.ganadores.push(...nuevos);
        return nuevos;
    }

    function girar() {
        if (girando || estado.numbers.length === 0 || modalAbierto()) return;
        girando = true;
        dibujarEstado();
        const maq = $('maquina');
        maq.classList.add('girando');
        const dur = 1300;
        sonidoGiro(dur / 1000);
        setTimeout(() => {
            maq.classList.remove('girando');
            const i = Math.floor(Math.random() * estado.numbers.length);
            const n = estado.numbers.splice(i, 1)[0];
            estado.drawnNumbers.push(n);
            const nuevos = evaluarGanadores(n);
            Bingo.guardarEstado(estado);
            girando = false;
            dibujarTodo(true);
            sonidoBola();
            cantar(n);
            if (nuevos.length) setTimeout(() => celebrar(nuevos), 900);
            else if (autoTimer) programarAuto();
            if (estado.numbers.length === 0) pararAuto();
        }, dur);
    }

    function deshacer() {
        if (girando || !estado.drawnNumbers.length) return;
        const n = estado.drawnNumbers.pop();
        estado.numbers.push(n);
        const total = estado.drawnNumbers.length;
        estado.ganadores = estado.ganadores.filter(g => g.bola <= total);
        Object.keys(FLAG).forEach(t => { estado[FLAG[t]] = estado.ganadores.some(g => g.tipo === t); });
        Bingo.guardarEstado(estado);
        dibujarTodo(false);
        toast(`Se devolvió la bolilla ${n} al bolillero`);
    }

    function reiniciar() {
        confirmar('¿Reiniciar el juego?', 'Se vuelven todas las bolillas al bolillero y se borran los ganadores. Los cartones cargados no se borran.', () => {
            pararAuto();
            estado = Bingo.estadoVacio();
            Bingo.borrarEstado();
            dibujarTodo(false);
            toast('Juego reiniciado');
        });
    }

    /* ---------- Automático ---------- */
    function programarAuto() {
        clearTimeout(autoTimer);
        autoTimer = setTimeout(girar, prefs.velocidad * 1000);
    }
    function pararAuto() {
        clearTimeout(autoTimer); autoTimer = null;
        $('btnAuto').textContent = '▶ Automático'; $('btnAuto').classList.remove('activo');
    }
    function alternarAuto() {
        if (autoTimer) { pararAuto(); return; }
        if (!estado.numbers.length) return;
        $('btnAuto').textContent = '⏸ Pausar'; $('btnAuto').classList.add('activo');
        autoTimer = -1; // marca activo
        girar();
    }

    /* ---------- Celebración ---------- */
    function celebrar(nuevos) {
        const tipo = nuevos[0].tipo;
        const esBingo = tipo === 'bingo';
        const lista = nuevos;
        if (esBingo) pararAuto();
        $('ganTitulo').textContent = esBingo ? '¡¡BINGO!!' : `¡${NOMBRE[tipo]}!`;
        $('ganSub').textContent = `Con la bolilla ${lista[0].numeroBola} (bolilla N° ${lista[0].bola})` + (lista.length > 1 ? ` · ${lista.length} ganadores` : '');
        const cartones = Bingo.cargarCartones();
        $('ganCartones').innerHTML = lista.map(g => {
            const c = cartones.find(c => c.id === g.cartonId);
            return c ? Bingo.htmlCarton(c, estado.drawnNumbers, g.numeroBola) : '';
        }).join('');
        $('modalGanador').classList.add('abierto');
        sonidoPremio();
        const nombres = lista.map(g => `cartón ${g.numero}, ${g.comprador || ''}`).join('; ');
        setTimeout(() => decir(`¡${{ cuaterno: 'Cuaterno', linea: 'Línea', bingo: 'Bingo' }[tipo]}! ${nombres}`), 700);
        confeti();
    }
    function cerrarGanador() {
        $('modalGanador').classList.remove('abierto');
        if (autoTimer && !estado.bingoGanado) programarAuto();
        else if (estado.bingoGanado) pararAuto();
    }
    function confeti() {
        const colores = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa'];
        for (let i = 0; i < 120; i++) {
            const c = document.createElement('i');
            c.className = 'confeti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.background = colores[i % colores.length];
            c.style.animationDuration = (2 + Math.random() * 2.5) + 's';
            c.style.animationDelay = (Math.random() * .8) + 's';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 5500);
        }
    }

    /* ---------- Verificar cartón ---------- */
    function abrirVerificar() {
        $('modalVerificar').classList.add('abierto');
        $('verifInput').value = ''; verificar(); $('verifInput').focus();
    }
    function verificar() {
        const q = $('verifInput').value.trim().toLowerCase();
        const cartones = Bingo.cargarCartones();
        if (!q) { $('verifRes').innerHTML = `<p style="color:var(--gris);margin:0">Escribí el número del cartón o el nombre (${cartones.length} cartones cargados).</p>`; return; }
        const res = cartones.filter(c => String(c.numero) === q || (c.comprador || '').toLowerCase().includes(q)).slice(0, 12);
        const ultima = estado.drawnNumbers[estado.drawnNumbers.length - 1];
        $('verifRes').innerHTML = res.length
            ? res.map(c => Bingo.htmlCarton(c, estado.drawnNumbers, ultima)).join('')
            : '<p style="margin:0">No se encontró ningún cartón.</p>';
    }

    /* ---------- Confirmación ---------- */
    let accionConfirmar = null;
    function confirmar(titulo, texto, accion) {
        $('confTitulo').textContent = titulo; $('confTexto').textContent = texto;
        accionConfirmar = accion; $('modalConfirmar').classList.add('abierto');
    }
    $('confNo').onclick = () => $('modalConfirmar').classList.remove('abierto');
    $('confSi').onclick = () => { $('modalConfirmar').classList.remove('abierto'); if (accionConfirmar) accionConfirmar(); };

    function modalAbierto() { return !!document.querySelector('.modal.abierto'); }

    /* ---------- Eventos ---------- */
    $('btnGirar').onclick = girar;
    $('btnDeshacer').onclick = deshacer;
    $('btnReiniciar').onclick = reiniciar;
    $('btnAuto').onclick = alternarAuto;
    $('selVelocidad').value = prefs.velocidad;
    $('selVelocidad').onchange = e => { prefs.velocidad = +e.target.value; guardarPrefs(); if (autoTimer && !girando) programarAuto(); };
    $('btnVoz').onclick = () => { prefs.voz = !prefs.voz; guardarPrefs(); dibujarTodo(false); if (prefs.voz) decir('Voz activada'); else speechSynthesis && speechSynthesis.cancel(); };
    $('btnSonido').onclick = () => { prefs.sonido = !prefs.sonido; guardarPrefs(); dibujarTodo(false); };
    $('btnCerrarGanador').onclick = cerrarGanador;
    $('btnVerificar').onclick = abrirVerificar;
    $('btnCerrarVerif').onclick = () => $('modalVerificar').classList.remove('abierto');
    $('verifInput').oninput = verificar;
    function pantallaCompleta() {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    }
    $('btnPantalla').onclick = pantallaCompleta;

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            if ($('modalGanador').classList.contains('abierto')) cerrarGanador();
            document.querySelectorAll('.modal.abierto').forEach(m => m.classList.remove('abierto'));
            return;
        }
        if (e.target.matches('input, select, textarea') || modalAbierto()) {
            if (e.key === 'Enter' && $('modalGanador').classList.contains('abierto')) cerrarGanador();
            return;
        }
        if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); girar(); }
        else if (e.key === 'a' || e.key === 'A') alternarAuto();
        else if (e.key === 'f' || e.key === 'F') pantallaCompleta();
    });

    // Si se editan cartones en otra pestaña, actualizar paneles
    window.addEventListener('storage', e => {
        if (e.key === 'cartones') dibujarEstado();
        if (e.key === 'bingoState') { estado = Bingo.cargarEstado(); dibujarTodo(false); }
    });
    if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { };

    dibujarTodo(false);
</script>
</body>
</html>
